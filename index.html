<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Song Choices</title>
        <script src="script.js" defer></script>
        <style>
            body {
                background-color: rgb(189, 186, 186);
                justify-items: center;
            }
            button, select {
                margin: 5px;
                border: 1px solid black;
                border-radius: 4px;
                padding: 5px;
                font-size: 16px;
            }
            button:hover, select:hover {
                background-color: rgb(219, 217, 217);
            }
            button:active {
                background-color: white;
                border: 2px solid rgb(0, 0, 0);
                margin: 4.1px;
            }
            li {
                list-style: none;
                margin: 15px;
                font-size: 1.2em;
                padding: 5px;
                border: 1.5px solid black;
                padding: 10px;
            }
            li div{
                display: inline-block;
                margin: 0px;
                margin-right: 5px;
                width: 15px;
                height: 15px;
                opacity: 0%;
                background-image: url('Warning.png');
                background-size: 100%;
            }
            .Warning {
                opacity: 100%;
            }
            .ErrorMessage {
                display: none;
            }
            .Warning:hover .ErrorMessage, .Warning:active .ErrorMessage{
                all: unset;
                position: absolute;
                min-height: 30px;
                opacity: 100%;
                background-color: red;
                color: rgb(255, 255, 255);
                border: 1px solid black;
                max-width: 10em;
            }
        </style>
    </head>
    <body>
        <h1>Song Choices</h1>
        <div id="choiceSelect">
            <select id="picAmt">
                <option id="LeastPicked" value="-1">Least Picked</option>
                <option id="mostPicked" value="1">Most Picked</option>
                <option id="allSongs" value="0">All Songs</option>
            </select>
            <select id="songRange">
                <option id="1-4" value="1-5">1-4</option>
                <option id="1-2" value="1-3">1-2</option>
                <option id="3-4" value="3-5">3-4</option>
            </select>
            <button id="showAll" type="button">Show All:</button>
            <button id="pickOne" type="button">Pick One:</button>
        </div>
        <div id="songList">
            <ul id="ul">

            </ul>
        </div>
    </body>
</html>
