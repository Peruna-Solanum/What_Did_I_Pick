<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Song Choices</title>
        <script src="script.js" defer></script>
        <style>
            body {
                background-color: rgb(189, 186, 186);
                justify-items: center;
            }
            button, select {
                margin: 5px;
                border: 1px solid black;
                border-radius: 4px;
                padding: 5px;
                font-size: 16px;
            }
            button:hover, select:hover {
                background-color: rgb(219, 217, 217);
            }
            button:active {
                background-color: white;
                border: 2px solid rgb(0, 0, 0);
                margin: 4.1px;
            }
        </style>
    </head>
    <body>
        <h1>Song Choices</h1>
        <p>
            Ok, so for this I'm going to need: 1. Show all Songs with name/dates picked/notes to fix?, song order
            2. group by date last used/most used in general and by placement of song 
            3. button to pick 1-2 or 3-4 song 
        </p>
        <div id="choiceSelect">
            <select id="picAmt">
                <option id="allSongs" value="0">All Songs</option>
                <option id="LeastPicked" value="-1">Least Picked</option>
                <option id="mostPicked" value="1">Most Picked</option>
            </select>
            <select id="songRange">
                <option id="1-4" value="1-4">1-4</option>
                <option id="1-2" value="1-3">1-2</option>
                <option id="3-4" value="3-5">3-4</option>
            </select>
            <button id="showAll" type="button">Show All:</button>
            <button id="pickOne" type="button">Pick One:</button>
        </div>
        <div id="songList">
            <ul id="ul">

            </ul>
        </div>
    </body>
</html>
